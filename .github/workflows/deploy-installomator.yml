name: Deploy Installomator to Jamf Pro

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate script syntax
        run: /bin/zsh -n Installomator.sh

      - name: Verify Installomator responds
        run: /bin/zsh Installomator.sh version

  deploy:
    needs: validate
    runs-on: macos-latest
    environment: jamf-production

    steps:
      - uses: actions/checkout@v4

      - name: Obtain Jamf access token
        id: jamf-auth
        shell: bash
        env:
          JAMF_URL: ${{ secrets.JAMF_URL }}
          JAMF_CLIENT_ID: ${{ secrets.JAMF_CLIENT_ID }}
          JAMF_CLIENT_SECRET: ${{ secrets.JAMF_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          response="$(
            curl --silent --show-error --fail-with-body \
              --request POST \
              "${JAMF_URL%/}/api/v1/oauth/token" \
              --header "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_id=${JAMF_CLIENT_ID}" \
              --data-urlencode "client_secret=${JAMF_CLIENT_SECRET}"
          )"

          token="$(jq -er '.access_token' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Retrieve current Jamf script
        shell: bash
        env:
          JAMF_URL: ${{ secrets.JAMF_URL }}
          JAMF_TOKEN: ${{ steps.jamf-auth.outputs.token }}
          JAMF_SCRIPT_ID: ${{ vars.JAMF_SCRIPT_ID }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            "${JAMF_URL%/}/api/v1/scripts/${JAMF_SCRIPT_ID}" \
            --header "Authorization: Bearer ${JAMF_TOKEN}" \
            --header "Accept: application/json" \
            --output current-script.json

      - name: Build replacement payload
        run: |
          jq --rawfile contents Installomator.sh \
            '.scriptContents = $contents | del(.id)' \
            current-script.json > updated-script.json

      - name: Update Jamf script
        shell: bash
        env:
          JAMF_URL: ${{ secrets.JAMF_URL }}
          JAMF_TOKEN: ${{ steps.jamf-auth.outputs.token }}
          JAMF_SCRIPT_ID: ${{ vars.JAMF_SCRIPT_ID }}
        run: |
          set -euo pipefail

          curl --silent --show-error --fail-with-body \
            --request PUT \
            "${JAMF_URL%/}/api/v1/scripts/${JAMF_SCRIPT_ID}" \
            --header "Authorization: Bearer ${JAMF_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data-binary @updated-script.json
